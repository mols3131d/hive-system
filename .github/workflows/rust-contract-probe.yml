name: Rust contract probe

on:
  pull_request:
    paths:
      - "tests/rust-contract-probe/**"
      - ".github/workflows/rust-contract-probe.yml"

permissions:
  contents: read

concurrency:
  group: rust-contract-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tests/rust-contract-probe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select stable toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          rustc +1.100.0 --version --verbose
          cargo +1.100.0 --version
      - name: Resolve dependencies
        run: |
          cargo +1.100.0 generate-lockfile
          cargo +1.100.0 tree --locked > dependency-tree.txt
          cargo +1.100.0 metadata --locked --format-version 1 > metadata.json
          jq -r '.packages[] | [.name, .version, (.license // "unspecified")] | @tsv' metadata.json | sort > licenses.tsv
          cat licenses.tsv
          echo '--- BEGIN GENERATED CARGO LOCK ---'
          cat Cargo.lock
          echo '--- END GENERATED CARGO LOCK ---'
          rustc +1.100.0 --version --verbose > rust-version.txt
      - name: Test contract
        run: cargo +1.100.0 test --locked --all-targets
      - name: Check formatting
        run: cargo +1.100.0 fmt --all -- --check
      - name: Check lints
        run: cargo +1.100.0 clippy --locked --all-targets -- -D warnings
      - name: Build and install in isolated directory
        run: |
          cargo +1.100.0 build --locked
          cargo +1.100.0 install --locked --path . --root "$RUNNER_TEMP/hive-probe"
          "$RUNNER_TEMP/hive-probe/bin/hive-contract-probe" --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-contract-evidence
          path: |
            tests/rust-contract-probe/Cargo.lock
            tests/rust-contract-probe/dependency-tree.txt
            tests/rust-contract-probe/metadata.json
            tests/rust-contract-probe/rust-version.txt
            tests/rust-contract-probe/licenses.tsv
          retention-days: 7
          if-no-files-found: warn
