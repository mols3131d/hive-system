[package]
name = "hive"
version = "0.1.0"
edition = "2024"
description = "Local CLI for Hive collaboration workspaces"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive", "string"] }
mysql = { version = "=28.0.4", default-features = false, features = ["minimal-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }
